name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MarketPulse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MarketPulse-apk
          path: MarketPulse.apk

      - name: Publish release (download on your phone from the Releases page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MarketPulse.apk --title "MarketPulse (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download MarketPulse.apk on your Android phone and open it to install."

      - name: Push APK to the apk branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir /tmp/out && cp MarketPulse.apk /tmp/out/
          git checkout --orphan apk
          git rm -rf --quiet --cached .
          cp /tmp/out/MarketPulse.apk .
          git add -f MarketPulse.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f origin apk
