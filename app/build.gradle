plugins {
    id "com.android.application"
}

android {
    namespace "com.marketpulse.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.marketpulse.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away.
            // Swap in your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
