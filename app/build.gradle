plugins {
    id "com.android.application"
}

android {
    namespace "com.marketpulse.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.marketpulse.app"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "3.2"
    }

    // One permanent key (signing/release.jks, kept in this private repo) so each
    // new APK installs over the previous one. Use a separate upload key for Google Play.
    def ksProps = new Properties()
    def ksFile = rootProject.file("signing/release.properties")
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file("signing/release.jks")
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Ship the repo's CHANGELOG.md inside the app (Profile -> What's new).
// Single source: edit only /CHANGELOG.md; the build copies it into the assets.
def changelogDir = layout.buildDirectory.dir("generated/changelog")
def copyChangelog = tasks.register("copyChangelog", Copy) {
    from rootProject.file("CHANGELOG.md")
    into changelogDir
}
android.sourceSets.main.assets.srcDir(changelogDir)
android.applicationVariants.all { variant ->
    variant.mergeAssetsProvider.configure { dependsOn copyChangelog }
}
