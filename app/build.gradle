plugins {
    id "com.android.application"
}

android {
    namespace "com.marketpulse.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.marketpulse.app"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "3.2"
    }

    // One permanent key (signing/release.jks, kept in this private repo) so each
    // new APK installs over the previous one. Use a separate upload key for Google Play.
    def ksProps = new Properties()
    def ksFile = rootProject.file("signing/release.properties")
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file("signing/release.jks")
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Ship the repo's CHANGELOG.md inside the app (Profile -> What's new).
// Single source: edit only /CHANGELOG.md; the build copies it into each variant's assets.
abstract class CopyChangelogTask extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getSource()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        def out = outputDir.get().asFile
        out.mkdirs()
        new File(out, "CHANGELOG.md").text = source.get().asFile.getText("UTF-8")
    }
}

def copyChangelog = tasks.register("copyChangelog", CopyChangelogTask) {
    source.set(rootProject.layout.projectDirectory.file("CHANGELOG.md"))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(copyChangelog, CopyChangelogTask::getOutputDir)
    }
}
